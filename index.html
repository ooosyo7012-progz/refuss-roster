<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>레푸스 근무표</title>
<style>
:root{
  --red:#E31837; --rose:#D8325A; --rose-deep:#B8173A;
  --blush:#FFF4F6; --blush-2:#FDE7EC; --petal:#F9D3DC;
  --ink:#2A2228; --soft-ink:#4A3F46; --grey:#8C8088; --line:#F0E1E5;
  --bg:#FFFFFF; --weekend:#FFF7F8; --closed:#F3EFF1;
  --shadow:0 6px 24px rgba(216,50,90,.08), 0 1px 3px rgba(42,34,40,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Pretendard","Pretendard Variable","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;font-size:18px;line-height:1.55;-webkit-text-size-adjust:100%;
  background:linear-gradient(180deg,#FFF6F8 0,#FFFFFF 420px)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 60px}

/* 머리 */
header.top{background:transparent}
header.top .wrap{display:flex;align-items:center;gap:22px;padding-top:26px;padding-bottom:18px;flex-wrap:wrap}
header.top img{height:62px;width:auto;display:block;background:#fff;padding:8px 12px;border-radius:18px;box-shadow:var(--shadow)}
header.top h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.25;color:var(--ink)}
header.top h1 span{color:var(--red)}
header.top p{margin:4px 0 0;color:var(--grey);font-size:17px}
.redbar{display:none}

/* 단계 카드 */
section.step{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px 24px 26px;box-shadow:var(--shadow)}
section.step.plain{background:transparent;border:none;box-shadow:none;padding:6px 0 0}
.step-h{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.num{width:38px;height:38px;flex:none;background:var(--blush-2);color:var(--red);font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.step-h h2{margin:0;font-size:23px;font-weight:800;letter-spacing:-.02em}
.hint{color:var(--grey);font-size:16px;margin:4px 0 14px}

.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
select,input[type=number],input[type=text]{height:52px;border:1.5px solid #E9D6DB;background:#fff;padding:0 14px;font-size:19px;border-radius:14px;transition:border-color .15s, box-shadow .15s}
select:focus,input:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 4px rgba(216,50,90,.12)}
input[type=number]{width:90px;text-align:center}
label.lbl{font-weight:700;font-size:19px}

.btn{height:52px;padding:0 22px;border:1.5px solid #E9D6DB;background:#fff;font-weight:700;font-size:18px;cursor:pointer;border-radius:14px;transition:transform .1s, box-shadow .15s, background .15s}
.btn:hover{background:var(--blush)}
.btn:active{transform:translateY(1px)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:#41363E}
.btn.red{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 6px 16px rgba(227,24,55,.25)}
.btn.red:hover{background:var(--rose-deep);border-color:var(--rose-deep)}
.btn.big{height:68px;font-size:23px;font-weight:800;padding:0 32px;width:100%;border-radius:20px;background:linear-gradient(135deg,#F0466A 0%,#E31837 60%,#C9122F 100%);box-shadow:0 10px 26px rgba(227,24,55,.28)}
.btn.ghost{border-color:transparent;background:var(--blush);color:var(--grey);font-weight:600}
.btn.ghost:hover{color:var(--rose-deep)}

/* 직원 */
.staff-list{display:flex;flex-direction:column;gap:10px}
.staff-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--blush);padding:10px;border-radius:18px}
.staff-row .offbox{display:flex;align-items:center;gap:8px;white-space:nowrap;color:var(--soft-ink)}
.staff-row input[type=text]{width:100%;font-weight:700}

/* 요일 */
.dows{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;max-width:620px}
.dow{height:56px;border:1.5px solid #E9D6DB;background:#fff;font-weight:700;font-size:19px;cursor:pointer;border-radius:16px;transition:background .15s}
.dow:hover{background:var(--blush)}
.dow.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 4px 12px rgba(227,24,55,.25)}
.check{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:17px;cursor:pointer;color:var(--soft-ink)}
.check input{width:22px;height:22px;accent-color:var(--red)}

/* 휴무 신청 달력 */
.who{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.who button{height:50px;padding:0 18px;border:1.5px solid #E9D6DB;background:#fff;font-weight:700;font-size:18px;cursor:pointer;border-radius:16px}
.who button:hover{background:var(--blush)}
.who button.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 4px 12px rgba(227,24,55,.25)}
.who button small{font-weight:600;opacity:.8;margin-left:6px;font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .hd{text-align:center;font-weight:700;padding:6px 0;font-size:16px;color:var(--soft-ink)}
.cal .hd.sun{color:var(--rose)}
.cal .hd.sat{color:var(--grey)}
.cal .cell{min-height:86px;border:1.5px solid var(--line);background:#fff;padding:6px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;border-radius:16px;transition:border-color .15s, background .15s}
.cal .cell:hover{border-color:var(--petal);background:var(--blush)}
.cal .cell .d{font-weight:800;font-size:18px}
.cal .cell.we{background:var(--weekend)}
.cal .cell.mine{border-color:var(--red);background:var(--blush-2)}
.cal .cell.mine .d{color:var(--red)}
.cal .cell.closed{background:var(--closed);cursor:not-allowed;border-color:transparent;color:var(--grey)}
.cal .cell .tag{font-size:13px;line-height:1.35;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--soft-ink)}
.cal .cell .tag.me{color:var(--red);font-weight:800}
.cal .blank{min-height:86px}

/* 결과 */
#result{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.result-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.result-h h2{margin:0;font-size:27px;font-weight:800;letter-spacing:-.02em}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;margin:16px 0 10px;color:var(--grey);align-items:center}
.legend b{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;margin-right:6px;font-size:14px;vertical-align:middle;border-radius:8px}
.legend b.W{background:var(--blush-2);color:var(--rose-deep)}
.legend b.O{background:#fff;border:1px solid var(--line);color:#B9AEB4}
.legend b.R{background:#fff;border:1.5px dashed var(--red);color:var(--red)}
.legend b.X{background:var(--closed);color:var(--grey)}
.empty{border:2px dashed var(--petal);background:var(--blush);border-radius:18px;padding:30px;text-align:center;color:var(--soft-ink);font-size:18px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;-webkit-overflow-scrolling:touch}
table.roster{border-collapse:separate;border-spacing:3px;font-size:15px;min-width:100%;padding:4px}
table.roster th,table.roster td{text-align:center;padding:0;height:44px;min-width:38px;border-radius:10px}
table.roster thead th{background:#fff;font-weight:700;line-height:1.15;padding:4px 2px;color:var(--soft-ink)}
table.roster thead th .w{display:block;font-size:12px;font-weight:500;color:var(--grey)}
table.roster thead th.we{background:var(--weekend)}
table.roster thead th.closed{background:var(--closed);color:var(--grey)}
table.roster thead th.bad{background:var(--red);color:#fff}
table.roster thead th.bad .w{color:#fff}
table.roster .name{position:sticky;left:0;background:#fff;z-index:2;text-align:left;padding:0 12px;font-weight:800;min-width:92px;white-space:nowrap;box-shadow:6px 0 8px -6px rgba(42,34,40,.12)}
table.roster thead .name{z-index:3}
table.roster td.c{cursor:pointer;font-weight:700;user-select:none;transition:transform .1s}
td.c.W{background:var(--blush-2);color:var(--rose-deep)}
td.c.O{background:#fff;color:#C9BEC4;box-shadow:inset 0 0 0 1px var(--line)}
td.c.R{background:#fff;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
td.c.X{background:var(--closed);color:#B4A9AF;cursor:default}
td.c.err{background:var(--red)!important;color:#fff!important;box-shadow:none}
td.c.W:hover,td.c.O:hover,td.c.R:hover{transform:scale(1.08);box-shadow:0 3px 10px rgba(216,50,90,.25)}
td.c.colbad{outline:2px solid rgba(227,24,55,.35);outline-offset:-2px}
td.sum{font-weight:800;min-width:56px;background:var(--blush);color:var(--ink)}
tr.count td{font-weight:700;font-size:14px;background:#FBF8F9;color:var(--soft-ink)}
tr.count td.bad{background:var(--red);color:#fff}
tr.count td.name{background:#FBF8F9}

.problems{margin-top:18px;background:#FFF0F3;border:1.5px solid #F6B7C4;border-radius:18px;padding:16px 20px}
.problems h3{margin:0 0 8px;color:var(--red);font-size:20px;font-weight:800}
.problems ul{margin:0;padding-left:22px}
.problems li{margin:6px 0;color:var(--soft-ink)}
.problems li b{color:var(--red)}
.ok{margin-top:18px;background:var(--blush);border-radius:18px;padding:16px 20px;font-weight:700;font-size:18px;color:var(--rose-deep)}

.summary{margin-top:26px}
.summary h3{font-size:21px;font-weight:800;margin:0 0 10px}
table.sum{border-collapse:collapse;width:100%;font-size:18px}
table.sum th,table.sum td{border-bottom:1px solid var(--line);padding:12px 8px;text-align:center}
table.sum th{font-weight:700;color:var(--grey);font-size:16px;background:var(--blush)}
table.sum th:first-child{border-radius:12px 0 0 12px}
table.sum th:last-child{border-radius:0 12px 12px 0}
table.sum tr:last-child td{border-bottom:none}
table.sum td:first-child,table.sum th:first-child{text-align:left;font-weight:800;padding-left:14px}
table.sum td.diff{color:var(--red);font-weight:800}
.bar{display:inline-block;height:10px;background:linear-gradient(90deg,#F7A1B3,#E31837);vertical-align:middle;margin-left:8px;border-radius:6px}

.edited-note{font-size:15px;color:var(--grey);margin-top:8px}
.print-title{display:none}
.mode-staff .admin-only{display:none!important}
#cloudBar{margin-top:14px;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);font-size:16px}
#cloudBar .bar-t{flex:1;line-height:1.4}
#cloudBar .bar-s{color:var(--red);font-size:14px}
#cloudBar .dot{width:12px;height:12px;border-radius:50%;background:#2DB37A;flex:none;box-shadow:0 0 0 4px rgba(45,179,122,.15)}
#cloudBar .dot.warn{background:#F0A030;box-shadow:0 0 0 4px rgba(240,160,48,.18)}
.link-row{background:var(--blush);border-radius:18px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.link-l{display:flex;flex-direction:column;gap:2px;font-size:16px}
.link-l b{font-size:18px}
.link-l span{color:var(--grey);font-size:15px}
.link-l .warn-t{color:var(--red);font-weight:700}
.link-row input[type=text]{width:100%;font-size:15px;height:46px;color:var(--soft-ink)}
.cloud-err{color:var(--red);font-weight:700}
.lockmsg{background:#FFF0F3;border:1.5px solid #F6B7C4;color:var(--rose-deep);font-weight:700;border-radius:14px;padding:10px 14px;margin-bottom:12px}
footer{margin-top:36px;color:var(--grey);font-size:14px;text-align:center}

@media (max-width:640px){
  body{font-size:17px}
  header.top img{height:46px;border-radius:14px}
  header.top h1{font-size:24px}
  section.step,#result{padding:18px 14px 20px;border-radius:20px}
  .step-h h2{font-size:20px}
  .staff-row{grid-template-columns:1fr auto;}
  .staff-row .del{grid-column:2;grid-row:1}
  .staff-row .offbox{grid-column:1 / span 2}
  .cal{gap:4px}
  .cal .cell{min-height:70px;padding:4px;border-radius:12px}
  .cal .cell .d{font-size:16px}
  .cal .cell .tag{font-size:11px}
  .dow{font-size:17px;height:50px;border-radius:14px}
  .tools .btn{flex:1 1 auto;padding:0 12px;font-size:16px}
  .result-h h2{font-size:22px}
  table.sum{font-size:15px}
  table.sum th,table.sum td{padding:10px 4px}
  table.sum th{font-size:13px}
  table.sum td:first-child,table.sum th:first-child{padding-left:8px}
  table.sum td:first-child{white-space:nowrap}
  table.sum td{white-space:nowrap}
  .summary .bar{display:none}
  .cal .cell{padding:4px 3px}
  .cal .cell .tag{font-size:11px;letter-spacing:-.04em}
  table.roster{font-size:14px;border-spacing:2px}
  table.roster th,table.roster td{height:40px;min-width:32px;border-radius:8px}
  table.roster .name{min-width:64px;padding:0 6px;font-size:14px}
  .legend{gap:10px;font-size:14px}
}

@media print{
  @page{size:A4 landscape;margin:8mm}
  body{font-size:11px;background:#fff}
  .no-print{display:none!important}
  .print-title{display:block;font-size:18px;font-weight:800;margin:0 0 6px}
  .wrap{max-width:none;padding:0}
  #result{border:none;box-shadow:none;padding:0;margin:0}
  .tbl-wrap{overflow:visible;border:1px solid #ccc;border-radius:0}
  table.roster{font-size:10px;width:100%;border-spacing:1px;padding:0}
  table.roster th,table.roster td{height:24px;min-width:0;border-radius:3px}
  table.roster .name{min-width:0;padding:0 4px;box-shadow:none}
  table.roster *,.legend b,.problems,.ok,table.sum th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .problems,.ok,.summary{break-inside:avoid;font-size:11px;padding:6px 10px;margin-top:8px}
  .problems h3,.summary h3{font-size:13px}
  table.sum{font-size:11px}
  table.sum th,table.sum td{padding:3px 6px}
  .bar{display:none}
}
</style>

<script>
(function(){
'use strict';
var KEY = 'refuss_roster_v1';
var DOW = ['일','월','화','수','목','금','토'];
var MAX_STREAK = 5;

/* ---------- 저장 ---------- */
function load(){
  try{ var t = localStorage.getItem(KEY); if(t) return JSON.parse(t); }catch(e){}
  return null;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}

/* ---------- 날짜 도우미 ---------- */
function mk(y,m){ y = y||S.year; m = m||S.month; return y + '-' + (m<10?'0':'') + m; }
function dim(){ return new Date(S.year, S.month, 0).getDate(); }
function dowOf(d){ return new Date(S.year, S.month-1, d).getDay(); }
function isWeekend(d){ var w = dowOf(d); return w===0 || w===6; }
function isClosed(d){ return S.closed.indexOf(dowOf(d)) >= 0; }
function label(d){ return S.month + '월 ' + d + '일(' + DOW[dowOf(d)] + ')'; }

/* ---------- 처음 상태 ---------- */
function defaultState(){
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth() + 2;
  if(m > 12){ m = 1; y++; }
  var st = {
    year:y, month:m,
    staff:[
      {id:'s1', name:'김하나', off:2},
      {id:'s2', name:'이두리', off:2},
      {id:'s3', name:'박세나', off:2},
      {id:'s4', name:'최네오', off:2}
    ],
    closed:[1], closedCounts:true,
    needWd:2, needWe:3,
    requests:{}, schedules:{},
    nextId:5, sel:'s1'
  };
  // 예시 휴무 신청: 정기 휴무가 아닌 날 중에서 골라 넣기
  var D = new Date(y, m, 0).getDate();
  var open = [];
  for(var d=1; d<=D; d++){ if(new Date(y, m-1, d).getDay() !== 1) open.push(d); }
  function pick(list){ var out=[]; list.forEach(function(i){ if(open[i]) out.push(open[i]); }); return out; }
  var we = open.filter(function(d){ var w=new Date(y,m-1,d).getDay(); return w===0||w===6; });
  st.requests[mk(y,m)] = {
    s1: pick([2,3,15]),
    s2: pick([8,20,21]),
    s3: [we[1], we[5]].filter(Boolean),
    s4: pick([11,12,25])
  };
  return st;
}

var S = load();
if(!S || !S.staff){ S = defaultState(); save(); }
['requests','schedules'].forEach(function(k){ if(!S[k]) S[k] = {}; });
if(!S.closed) S.closed = [];

/* ---------- 요소 ---------- */
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function reqOf(id){
  var r = S.requests[mk()] || {};
  return r[id] || [];
}
function reqSet(id){
  var o = {}; reqOf(id).forEach(function(d){ o[d] = true; }); return o;
}

/* ---------- 1. 연도·월 ---------- */
function renderYM(){
  var ys = $('year'), ms = $('month'), cy = new Date().getFullYear(), h='';
  for(var y=cy-1; y<=cy+3; y++) h += '<option value="'+y+'"'+(y===S.year?' selected':'')+'>'+y+'년</option>';
  ys.innerHTML = h; h='';
  for(var m=1; m<=12; m++) h += '<option value="'+m+'"'+(m===S.month?' selected':'')+'>'+m+'월</option>';
  ms.innerHTML = h;
}
$('year').addEventListener('change', function(){ S.year = +this.value; save(); subscribeMonth(); renderAll(); });
$('month').addEventListener('change', function(){ S.month = +this.value; save(); subscribeMonth(); renderAll(); });

/* ---------- 2. 직원 ---------- */
function renderStaff(){
  var h = '';
  S.staff.forEach(function(s){
    h += '<div class="staff-row" data-id="'+s.id+'">'+
      '<input type="text" class="nm" value="'+esc(s.name)+'" placeholder="이름" aria-label="이름">'+
      '<div class="offbox"><span>주당 휴무</span><input type="number" class="off" min="0" max="7" value="'+s.off+'" aria-label="주당 휴무일 수"><span>일</span></div>'+
      '<button class="btn ghost del" type="button">삭제</button>'+
    '</div>';
  });
  $('staffList').innerHTML = h || '<div class="empty">직원을 추가해 주세요.</div>';
}
$('staffList').addEventListener('input', function(e){
  var row = e.target.closest('.staff-row'); if(!row) return;
  var s = S.staff.filter(function(x){ return x.id === row.dataset.id; })[0]; if(!s) return;
  if(e.target.classList.contains('nm')) s.name = e.target.value;
  if(e.target.classList.contains('off')){ var v = parseInt(e.target.value,10); s.off = isNaN(v)?0:Math.max(0,Math.min(7,v)); }

/* ---------- 목표 근무일 ---------- */
function openDays(){ var o=[]; for(var d=1; d<=dim(); d++) if(!isClosed(d)) o.push(d); return o; }
function need(d){ return isWeekend(d) ? S.needWe : S.needWd; }
function targetOf(s){
  var D = dim(), open = openDays().length, closedN = D - open;
  var offTotal = Math.round(s.off * D / 7);
  var offOpen = Math.max(0, offTotal - (S.closedCounts ? closedN : 0));
  var req = reqOf(s.id).filter(function(d){ return d<=D && !isClosed(d); }).length;
  return Math.max(0, open - Math.max(offOpen, req));
}

/* ---------- 연속 근무 계산 (정기 휴무일은 쉬는 날) ---------- */
function maxStreak(row){
  var best=0, cur=0;
  for(var d=1; d<=dim(); d++){
    if(row[d]==='W' && !isClosed(d)){ cur++; if(cur>best) best=cur; } else cur=0;
  }
  return best;
}

/* ---------- 자동 배정 ---------- */
function generate(){
  var D = dim(), staff = S.staff;
  var grid = {}, worked = {}, weCnt = {}, streak = {}, target = {}, rq = {};
  staff.forEach(function(s){
    grid[s.id] = []; for(var d=0; d<=D; d++) grid[s.id][d] = 'O';
    worked[s.id]=0; weCnt[s.id]=0; streak[s.id]=0; target[s.id]=targetOf(s); rq[s.id]=reqSet(s.id);
  });
  // 남은 영업일, 남은 필요 인원
  var openAfter = [], needAfter = [];
  openAfter[D+1]=0; needAfter[D+1]=0;
  for(var d2=D; d2>=1; d2--){
    openAfter[d2] = openAfter[d2+1] + (isClosed(d2)?0:1);
    needAfter[d2] = needAfter[d2+1] + (isClosed(d2)?0:need(d2));
  }
  function availLeft(s, from){
    var n=0; for(var d=from; d<=D; d++) if(!isClosed(d) && !rq[s.id][d]) n++; return n;
  }

  for(var d=1; d<=D; d++){
    if(isClosed(d)){ staff.forEach(function(s){ streak[s.id]=0; }); continue; }
    var we = isWeekend(d), nd = need(d);
    var info = staff.map(function(s){
      var rem = target[s.id] - worked[s.id];
      var left = availLeft(s, d);
      return {s:s, rem:rem, left:left,
        ok: !rq[s.id][d] && streak[s.id] < MAX_STREAK,
        must: rem>0 && rem>=left,
        ratio: left>0 ? rem/left : 0,
        tie: Math.random()};
    });
    var cand = info.filter(function(x){ return x.ok; });
    // 남은 근무를 남은 날에 고르게 퍼뜨리기
    var remSum = info.reduce(function(a,x){ return a + Math.max(0,x.rem); }, 0);
    var extra = Math.max(0, Math.round((remSum - needAfter[d]) / openAfter[d]));
    var want = nd + extra;
    cand.sort(function(a,b){
      if(a.must!==b.must) return a.must?-1:1;
      var ap=a.rem>0, bp=b.rem>0; if(ap!==bp) return ap?-1:1;
      // 다음 날 연속 근무 한도에 걸리는 사람은 뒤로
      if(we){ var dw = weCnt[a.s.id]-weCnt[b.s.id]; if(dw) return dw; }
      if(Math.abs(a.ratio-b.ratio) > 0.02) return b.ratio-a.ratio;
      return a.tie-b.tie;
    });
    var chosen = {};
    cand.forEach(function(x,i){
      if(i < want || x.must){ if(x.rem>0 || i < nd) chosen[x.s.id]=true; }
    });
    staff.forEach(function(s){
      if(chosen[s.id]){ grid[s.id][d]='W'; worked[s.id]++; streak[s.id]++; if(we) weCnt[s.id]++; }
      else streak[s.id]=0;
    });
  }

  function count(d){ var n=0; staff.forEach(function(s){ if(grid[s.id][d]==='W') n++; }); return n; }
  function canWork(s,d){
    if(isClosed(d) || rq[s.id][d] || grid[s.id][d]==='W') return false;
    grid[s.id][d]='W'; var ok = maxStreak(grid[s.id]) <= MAX_STREAK; grid[s.id][d]='O'; return ok;
  }

  // 모자란 날 다시 채우기 (목표보다 일을 더 하더라도 필요 인원 우선)
  for(var d3=1; d3<=D; d3++){
    if(isClosed(d3)) continue;
    while(count(d3) < need(d3)){
      var pool = staff.filter(function(s){ return canWork(s,d3); });
      if(!pool.length) break;
      pool.sort(function(a,b){
        var ra = target[a.id]-worked[a.id], rb = target[b.id]-worked[b.id];
        if(ra!==rb) return rb-ra;
        if(isWeekend(d3)) return weCnt[a.id]-weCnt[b.id];
        return 0;
      });
      var p = pool[0]; grid[p.id][d3]='W'; worked[p.id]++; if(isWeekend(d3)) weCnt[p.id]++;
    }
  }

  // 목표 근무일이 모자란 직원은 사람이 적은 날에 채우기
  staff.forEach(function(s){
    var days = openDays().slice().sort(function(a,b){ return (count(a)-need(a)) - (count(b)-need(b)) || Math.random()-.5; });
    for(var i=0; i<days.length && worked[s.id] < target[s.id]; i++){
      var dd = days[i];
      if(canWork(s,dd)){ grid[s.id][dd]='W'; worked[s.id]++; if(isWeekend(dd)) weCnt[s.id]++; }
    }
  });

  // 전체 점수를 매겨 조금씩 고쳐 나가기 (필요 인원·연속 근무 > 목표 근무일 > 주말 공평 > 인원 고르게)
  var opens = openDays();
  function score(){
    var c = 0;
    for(var i=0; i<opens.length; i++){
      var d = opens[i], n = 0;
      for(var k=0; k<staff.length; k++) if(grid[staff[k].id][d]==='W') n++;
      var nd = need(d);
      if(n < nd) c += (nd-n) * 1000; else c += (n-nd)*(n-nd) * 2;
    }
    var wes = [], sumWe = 0;
    for(var k2=0; k2<staff.length; k2++){
      var g = grid[staff[k2].id], w = 0, we = 0, run = 0;
      for(var d2=1; d2<=D; d2++){
        if(g[d2]==='W' && !isClosed(d2)){ w++; if(isWeekend(d2)) we++; run++; if(run > MAX_STREAK) c += 800; }
        else run = 0;
      }
      c += Math.abs(w - target[staff[k2].id]) * 60;
      wes.push(we); sumWe += we;
    }
    var mean = sumWe / (wes.length||1);
    for(var k3=0; k3<wes.length; k3++) c += (wes[k3]-mean)*(wes[k3]-mean) * 25;
    return c;
  }
  if(staff.length && opens.length){
    var cur = score(), best = cur, bestGrid = {};
    function snap(){ staff.forEach(function(s){ bestGrid[s.id] = grid[s.id].slice(); }); }
    snap();
    var ITER = Math.min(60000, 2500 * staff.length + 20000);
    for(var it=0; it<ITER; it++){
      var T = 60 * Math.pow(0.5/60, it/ITER);
      var d = opens[(Math.random()*opens.length)|0];
      var a = staff[(Math.random()*staff.length)|0];
      var changed = [];
      if(Math.random() < 0.5 || staff.length < 2){
        if(rq[a.id][d]) continue;
        grid[a.id][d] = grid[a.id][d]==='W' ? 'O' : 'W';
        changed.push([a.id,d]);
      } else {
        var b = staff[(Math.random()*staff.length)|0];
        if(a===b || grid[a.id][d]===grid[b.id][d]) continue;
        var on = grid[a.id][d]==='W' ? b : a, offp = on===a ? b : a;
        if(rq[on.id][d]) continue;
        grid[on.id][d]='W'; grid[offp.id][d]='O';
        changed.push([on.id,d],[offp.id,d]);
      }
      var nc = score(), dl = nc - cur;
      if(dl <= 0 || Math.random() < Math.exp(-dl/T)){
        cur = nc;
        if(cur < best){ best = cur; snap(); }
      } else {
        changed.forEach(function(x){ grid[x[0]][x[1]] = grid[x[0]][x[1]]==='W' ? 'O' : 'W'; });
      }
    }
    staff.forEach(function(s){ grid[s.id] = bestGrid[s.id]; });
  }
  var out = {};
  staff.forEach(function(s){ out[s.id] = grid[s.id].join('').slice(1); });
  S.schedules[mk()] = {rows:out, edited:false, at:Date.now(), days:D};
  save(); cloudSchedule();
}

/* ---------- 점검 ---------- */
function rowOf(sc, id){
  var D = dim(), r = sc.rows[id], a = ['O'];
  for(var d=1; d<=D; d++) a[d] = (r && r.charAt(d-1)==='W') ? 'W' : 'O';
  return a;
}
function analyze(sc){
  var D = dim(), dayIssues = {}, cellErr = {}, list = [];
  function add(d, msg){ (dayIssues[d] = dayIssues[d] || []).push(msg); }
  var rows = {}; S.staff.forEach(function(s){ rows[s.id] = rowOf(sc, s.id); cellErr[s.id] = {}; });

  for(var d=1; d<=D; d++){
    if(isClosed(d)) continue;
    var n = 0; S.staff.forEach(function(s){ if(rows[s.id][d]==='W') n++; });
    var nd = need(d);
    if(n < nd){
      var why = [];
      var reqNames = S.staff.filter(function(s){ return reqSet(s.id)[d]; }).map(function(s){ return s.name; });
      if(reqNames.length) why.push('휴무 신청 ' + reqNames.join('·'));
      var tired = S.staff.filter(function(s){
        if(rows[s.id][d]==='W' || reqSet(s.id)[d]) return false;
        var c=0; for(var k=d-1; k>=1 && rows[s.id][k]==='W' && !isClosed(k); k--) c++;
        var f=0; for(var j=d+1; j<=D && rows[s.id][j]==='W' && !isClosed(j); j++) f++;
        return c+f+1 > MAX_STREAK;
      }).map(function(s){ return s.name; });
      if(tired.length) why.push('연속 근무 5일 한도 ' + tired.join('·'));
      if(S.staff.length < nd) why.push('전체 직원이 ' + S.staff.length + '명뿐');
      add(d, '필요 ' + nd + '명인데 ' + n + '명 근무' + (why.length ? ' — ' + why.join(', ') : ''));
    }
  }
  S.staff.forEach(function(s){
    var rs = reqSet(s.id), r = rows[s.id];
    for(var d=1; d<=D; d++){
      if(r[d]==='W' && rs[d] && !isClosed(d)){ cellErr[s.id][d]=true; add(d, s.name + ' 님이 휴무 신청한 날에 근무'); }
    }
    var cur=0;
    for(var d2=1; d2<=D; d2++){
      if(r[d2]==='W' && !isClosed(d2)){
        cur++;
        if(cur > MAX_STREAK){ cellErr[s.id][d2]=true; if(cur===MAX_STREAK+1) add(d2, s.name + ' 님 ' + cur + '일째 연속 근무 (최대 5일)'); }
      } else cur=0;
    }
  });
  Object.keys(dayIssues).map(Number).sort(function(a,b){ return a-b; }).forEach(function(d){
    dayIssues[d].forEach(function(m){ list.push({d:d, msg:m}); });
  });
  return {dayIssues:dayIssues, cellErr:cellErr, list:list, rows:rows};
}

  h += '<div class="tbl-wrap"><table class="roster"><thead><tr><th class="name">이름</th>';

  }

  var stats = {};
  S.staff.forEach(function(s){
    var r = A.rows[s.id], rs = reqSet(s.id), w=0, we=0;
    h += '<tr><td class="name">' + esc(s.name||'(이름 없음)') + '</td>';
    for(var d=1; d<=D; d++){
      if(isClosed(d)){ h += '<td class="c X">정</td>'; continue; }
      var err = A.cellErr[s.id][d] ? ' err' : '';
      var colbad = A.dayIssues[d] ? ' colbad' : '';
      if(r[d]==='W'){ w++; if(isWeekend(d)) we++; h += '<td class="c W'+err+colbad+'" data-s="'+s.id+'" data-d="'+d+'" title="'+label(d)+' 근무">근</td>'; }
      else if(rs[d]) h += '<td class="c R'+colbad+'" data-s="'+s.id+'" data-d="'+d+'" title="'+label(d)+' 휴무 신청">신</td>';
      else h += '<td class="c O'+colbad+'" data-s="'+s.id+'" data-d="'+d+'" title="'+label(d)+' 휴무">휴</td>';
    }
    stats[s.id] = {w:w, we:we};
    h += '<td class="sum">' + w + '</td><td class="sum">' + we + '</td></tr>';
  });
  h += '<tr class="count"><td class="name">근무 인원</td>';
  for(var d4=1; d4<=D; d4++){
    if(isClosed(d4)){ h += '<td>-</td>'; continue; }
    var n=0; S.staff.forEach(function(s){ if(A.rows[s.id][d4]==='W') n++; });
    h += '<td class="' + (n<need(d4)?'bad':'') + '">' + n + '/' + need(d4) + '</td>';

/* ---------- CSV ---------- */
function downloadCSV(){
  var sc = S.schedules[mk()]; if(!sc) return;
  var D = dim();
  function q(v){ v = String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
  var head = ['이름'];
  for(var d=1; d<=D; d++) head.push(d + '일(' + DOW[dowOf(d)] + ')');
  head.push('근무일수','주말 근무일수');
  var lines = [head.map(q).join(',')];
  S.staff.forEach(function(s){
    var r = rowOf(sc, s.id), rs = reqSet(s.id), w=0, we=0, cells=[s.name];
    for(var d=1; d<=D; d++){
      if(isClosed(d)) cells.push('정기휴무');
      else if(r[d]==='W'){ cells.push('근무'); w++; if(isWeekend(d)) we++; }
      else cells.push(rs[d] ? '휴무(신청)' : '휴무');
    }
    cells.push(w, we);
    lines.push(cells.map(q).join(','));
  });
  var cnt = ['근무 인원'];
  for(var d2=1; d2<=D; d2++){
    if(isClosed(d2)){ cnt.push('-'); continue; }
    var n=0; S.staff.forEach(function(s){ if(rowOf(sc,s.id)[d2]==='W') n++; });
    cnt.push(n + '/' + need(d2));
  }
  lines.push(cnt.map(q).join(','));
  var blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '레푸스_근무표_' + S.year + '년_' + S.month + '월.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

  CL.sid = sid; CL.key = key || null; CL.on = true; CL.role = key ? 'admin' : 'staff';

  else S = {year:S.year, month:S.month, staff:[], closed:[], closedCounts:true, needWd:2, needWe:3, requests:{}, schedules:{}, nextId:1, sel:null};
  if(!S.requests) S.requests = {};
  if(!S.schedules) S.schedules = {};
  try{ history.replaceState(null, '', '#s=' + sid); }catch(e){}
  setStatus('연결하는 중이에요…');
  applyMode(); renderAll();

  fb().then(function(fs){
    var aref = fs.doc(CL.db, 'stores', sid, 'admins', CL.uid);
    return fs.getDoc(aref).then(function(s){ return s.exists(); }, function(){ return false; })
    .then(function(isAdm){
      if(isAdm || !key) return isAdm;
      return fs.setDoc(aref, {key:key}).then(function(){ return true; }, function(){
        alert('지점장 링크가 올바르지 않아요. 직원 화면으로 열게요.');

      CL.role = isAdm ? 'admin' : 'staff';
      try{ localStorage.setItem(LINK_KEY, JSON.stringify({sid:sid, key:CL.key})); }catch(e){}
      CL.unsubStore = fs.onSnapshot(storeRef(), function(snap){
        if(!snap.exists()){ setStatus('매장을 찾을 수 없어요. 링크를 다시 확인해 주세요.'); return; }
        var d = snap.data();
        CL.storeName = d.name || '';
        if(!CL.setTimer){
          ['staff','closed','closedCounts','needWd','needWe','nextId'].forEach(function(k){ if(d[k] !== undefined) S[k] = d[k]; });
        }

}

function subscribeMonth(){

  CL.unsubMonth = CL.f.onSnapshot(monthRef(k), function(snap){
    var d = snap.exists() ? snap.data() : {};

    CL.locked[k] = !!d.locked;

  }, function(e){ setStatus(errMsg(e)); });

  try{ saved = JSON.parse(localStorage.getItem(LINK_KEY) || 'null'); }catch(e){}
  if(h.s) connect(h.s, h.k || (saved && saved.sid === h.s ? saved.key : null));
  else if(saved && saved.sid) connect(saved.sid, saved.key);
}

function renderAll(){ renderYM(); renderStaff(); renderDows(); renderNeed(); renderWho(); renderCal(); renderResult(); renderCloud(); renumber(); }
applyMode();
renderAll();
startCloud();
})();
</script>

<script>
(function(){
  if(!('serviceWorker' in navigator) || location.protocol.indexOf('http')!==0) return;
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  var bar=document.getElementById('installBar'), btn=document.getElementById('installBtn'), msg=document.getElementById('installMsg');
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  var closed=false; try{ closed = localStorage.getItem('refuss_install_closed')==='1'; }catch(e){}
  if(standalone || closed) return;
  document.getElementById('installClose').onclick=function(){ bar.style.display='none'; try{ localStorage.setItem('refuss_install_closed','1'); }catch(e){} };
  var deferred=null;
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred=e; bar.style.display='flex'; });
  btn.onclick=function(){ if(!deferred) return; deferred.prompt(); deferred.userChoice.then(function(){ deferred=null; bar.style.display='none'; }); };
  window.addEventListener('appinstalled', function(){ bar.style.display='none'; });
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  if(ios){

    btn.style.display='none'; bar.style.display='flex';
  }
})();
</script>
